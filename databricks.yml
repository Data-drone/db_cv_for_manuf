bundle:
  name: db-cv-for-manuf

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog name
    default: brian_gen_ai
  schema:
    description: Unity Catalog schema name
    default: cv_manufacturing
  hf_secret_scope:
    description: Databricks secret scope containing the HuggingFace token
    default: cv-manufacturing
  hf_secret_key:
    description: Key within the secret scope for the HuggingFace token
    default: hf-token
  warehouse_id:
    description: SQL warehouse the cv_manuf_inspect app uses to query batch_run_log
    default: ""
  vs_endpoint_name:
    description: Databricks Vector Search endpoint name
    default: cv-vector-search
  lakebase_postgres_branch:
    description: Lakebase Postgres branch path for the CV Explorer app
    default: projects/cv-explorer/branches/production
  lakebase_postgres_database:
    description: Lakebase Postgres database path for the CV Explorer app
    default: projects/cv-explorer/branches/production/databases/cv-explorer-db
  serving_endpoint_name:
    description: SAM 3.1 model serving endpoint name
    default: cv-sam31-cv_manufacturing

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-classic-stable-hdtwu7.cloud.databricks.com
      profile: fevm-classic-stable
    variables:
      catalog: classic_stable_hdtwu7_catalog
      schema: cv_manufacturing

  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: brian_gen_ai
      schema: cv_manufacturing
